<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0e1116" />

    <title>VRcam — see the decor before you build it</title>
    <meta
      name="description"
      content="Photograph a venue, rough it out in 3D, dress it with flowers, balloons and drapes, and show your client the finished event — with the bill of materials and the price attached."
    />

    <!-- Link previews. This audience shares work over WhatsApp, where a bare
         URL with no card looks like spam. Add a 1200x630 public/og-image.png
         and point og:image at it to get a thumbnail. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="VRcam — see the decor before you build it" />
    <meta
      property="og:description"
      content="Turn venue photos into a 3D event preview your client can walk through, with the quote built in."
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
